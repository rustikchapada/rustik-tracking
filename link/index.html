    body {

      min-height: 100dvh;

      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {

      position: fixed;
      inset: 0;
      background-image: url('/link/bg.png');
      background-size: cover;
      background-position: center;
      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10,8,5,0.55) 0%,
        rgba(10,8,5,0.72) 40%,

    .logo-area {

      margin-bottom: 36px;
    }

    .logo-wordmark {

      font-size: 32px;

      text-transform: uppercase;
    }

    .logo-sub {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: #D4A96A;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #D4A96A;
      margin: 20px auto 0;
      opacity: 0.6;
    }

    .links {

      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 360px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: transform 0.15s ease, opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.97);
      opacity: 0.85;
    }

    .btn-site {
      background: #D4A96A;
      color: #1C1C1C;
    }

    .btn-whatsapp {
      background: transparent;
      color: #F5F0EA;
      border: 1px solid rgba(245,240,234,0.25);
    }

    .btn-maps {
      background: transparent;
      color: #F5F0EA;
      border: 1px solid rgba(245,240,234,0.25);
    }

    .btn-tarifario {
      background: transparent;
      color: #F5F0EA;

    .btn-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;

      justify-content: center;

      display: block;
      line-height: 1;

    .btn-desc {

      font-weight: 400;

    footer {

      color: #444;

      letter-spacing: 0.05em;

    footer a {

      text-decoration: none;
